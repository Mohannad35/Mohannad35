name: Contribution heatmap

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render assets/heatmap.svg
        env:
          # PROFILE_TOKEN is optional: a fine-grained token with no extra scopes.
          # Without it the default token is used, which counts private work only
          # when "Include private contributions on my profile" is on.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: node scripts/build-heatmap.mjs
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/heatmap.svg; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg
          git commit -m "Refresh contribution heatmap"
          git push
